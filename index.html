<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf4" />
    <meta
      name="description"
      content="SILKWAY — прибор для обогащения воды водородом: современное решение для дома."
    />
    <meta property="og:title" content="SILKWAY — Ваше здоровье- наш приоритет" />
    <meta property="og:description" content="SILKWAY — прибор для обогащения воды водородом: современное решение для дома." />
    <meta property="og:image" content="/brand/og-logo.png" />
    <meta property="og:type" content="website" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/hero/hero-bg-mobile.webp?v=3"
      media="(max-width: 63.99rem)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/hero/hero-bg-desktop.webp?v=3"
      media="(min-width: 64rem)"
      fetchpriority="high"
    />
    <title>SILKWAY — Ваше здоровье- наш приоритет</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Если модуль приложения не загрузился (404/MIME/синтаксис/кеш webview) — показываем сообщение и перезагрузку, а не белый экран. */
      (function(){
        var shown=false;
        function show(why){
          var r=document.getElementById("root");if(shown||!r||r.dataset.ok)return;shown=true;
          r.innerHTML='<div role="alert" data-testid="boot-fail" style="font:16px/1.4 system-ui,-apple-system,sans-serif;padding:24px;color:#1f2a1f"><p style="margin:0 0 16px;color:#900">Не удалось загрузить приложение'+(why?' ('+why+')':'')+'.</p><button type="button" style="font:inherit;padding:10px 18px;border-radius:10px;border:0;background:#2f5d34;color:#fff">Перезагрузить</button></div>';
          r.querySelector("button").onclick=function(){try{var u=new URL(location.href);u.searchParams.set("r",String(Date.now()));location.replace(u.toString())}catch(e){location.reload()}};
        }
        window.addEventListener("error",function(e){var t=e.target;if(t&&t.id==="max-bridge")return;if(t&&t.tagName){if(t.tagName==="SCRIPT"||(t.tagName==="LINK"&&/stylesheet|modulepreload/.test(t.rel)))show("ресурс")}else show("ошибка")},true);
        window.addEventListener("unhandledrejection",function(){show("ошибка")});
        setTimeout(function(){show("таймаут")},20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
