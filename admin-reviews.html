<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf4" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Опубликованные отзывы — SILKWAY</title>
    <link rel="preconnect" href="https://st.max.ru" crossorigin />
    <style>
      html,body{margin:0;background:#fbfaf4;color:#1f2a1f}
      .boot{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;display:flex;align-items:center;gap:12px}
      .boot i{width:18px;height:18px;border:2px solid #c9cfbf;border-top-color:#2f5d34;border-radius:50%;animation:s 0.8s linear infinite}
      @keyframes s{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.boot i{animation:none}}
    </style>
    <script>
      /* MAX Bridge грузится асинхронно и не блокирует первую отрисовку. Состояние — в window.__maxBridge,
         изменения — событием "maxbridge". Повторная попытка — window.__loadMaxBridge(). */
      (function(){
        var w=window;
        w.__loadMaxBridge=function(){
          if(w.WebApp){w.__maxBridge={state:"ready"};w.dispatchEvent(new Event("maxbridge"));return}
          var old=document.getElementById("max-bridge");if(old)old.remove();
          w.__maxBridge={state:"loading"};
          var s=document.createElement("script");
          s.id="max-bridge";s.async=true;s.src="https://st.max.ru/js/max-web-app.js";
          s.onload=function(){w.__maxBridge={state:"ready"};w.dispatchEvent(new Event("maxbridge"))};
          s.onerror=function(){w.__maxBridge={state:"error"};w.dispatchEvent(new Event("maxbridge"))};
          document.head.appendChild(s);
        };
        w.__loadMaxBridge();
      })();
    </script>
  </head>
  <body>
    <div id="root"><p class="boot" role="status"><i aria-hidden="true"></i>Загрузка…</p></div>
    <script>
      /* Если модуль приложения не загрузился (404/MIME/синтаксис/кеш webview) — показываем сообщение и перезагрузку, а не белый экран. */
      (function(){
        var shown=false;
        function show(why){
          var r=document.getElementById("root");if(shown||!r||r.dataset.ok)return;shown=true;
          r.innerHTML='<div role="alert" data-testid="boot-fail" style="font:16px/1.4 system-ui,-apple-system,sans-serif;padding:24px;color:#1f2a1f"><p style="margin:0 0 16px;color:#900">Не удалось загрузить приложение'+(why?' ('+why+')':'')+'.</p><button type="button" style="font:inherit;padding:10px 18px;border-radius:10px;border:0;background:#2f5d34;color:#fff">Перезагрузить</button></div>';
          r.querySelector("button").onclick=function(){try{var u=new URL(location.href);u.searchParams.set("r",String(Date.now()));location.replace(u.toString())}catch(e){location.reload()}};
        }
        window.addEventListener("error",function(e){var t=e.target;if(t&&t.id==="max-bridge")return;if(t&&t.tagName){if(t.tagName==="SCRIPT"||(t.tagName==="LINK"&&/stylesheet|modulepreload/.test(t.rel)))show("ресурс")}else show("ошибка")},true);
        window.addEventListener("unhandledrejection",function(){show("ошибка")});
        setTimeout(function(){show("таймаут")},20000);
      })();
    </script>
    <script type="module" src="/src/admin-reviews/main.tsx"></script>
  </body>
</html>
